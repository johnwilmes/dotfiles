- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc
    ~/.zprofile: zsh/zprofile
    ~/.config/zsh/homebrew.zsh: zsh/homebrew.zsh
    ~/.local/share/ohmyzsh: zsh/ohmyzsh
    ~/.local/share/omz-local/plugins:
      path: zsh/plugins
    ~/.local/share/omz-local/themes:
      path: zsh/themes
    ~/.local/share/omz-local/:
      glob: true
      path: zsh/local/*.zsh
    ~/.config/git:

    ~/.config/nvim/:
      glob: true
      path: nvim/*

- clean: ['~']
- clean:
    ~/.config:
      recursive: true
- clean:
    ~/.local:
      recursive: true
